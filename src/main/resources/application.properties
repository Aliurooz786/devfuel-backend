spring.application.name=devfuel
# ===============================
# Project & Server Config
# ===============================
server.port=8080

# Java 21 Virtual Threads Enable (for high performance) [cite: 168]
spring.threads.virtual.enabled=true

# ===============================
# OpenAI / Spring AI Config
# ===============================
# GPT-4o mini is used for extraction because it's fast and cost-effective
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.3

# ===============================
# Database Config (PostgreSQL) [cite: 173]
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/devfuel_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# Prompt Registry Config [cite: 93]
# ===============================
# Path to your .st files for the agents
devfuel.prompts.extraction-path=classpath:/prompts/extraction-agent.st

# ===============================
# Logging Config
# ===============================
logging.level.org.springframework.ai=DEBUG
logging.level.com.example.urooz.devfuel=DEBUG